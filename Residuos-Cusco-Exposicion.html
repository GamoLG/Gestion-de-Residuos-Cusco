<!doctype html>
<!-- Proyecto realizado por el estudiante Jhoel Alex Luicho Quispe, estudiante de la Escuela Profesional de Ingeniería Informática y de Sistemas - UNSAAC. -->
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Residuos Cusco — Exposición</title>
<style>
  :root{
    --bg:#0d1117; --elev:#161b22; --surf:#21262d; --surf2:#2a313c; --bd:#30363d;
    --tx:#e6edf3; --tx2:#9aa7b5; --tx3:#6e7681;
    --azul:#58a6ff; --azulD:#1f6feb;
    --verde:#3fb950; --verdeD:#238636;
    --morado:#a371f7; --moradoD:#8957e5;
    --ambar:#d29922; --dang:#f85149; --cian:#39c5cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
  body{
    font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--tx);
  }
  ::selection{background:var(--morado);color:#fff}

  #deck{height:100%;width:100%;position:relative}
  .slide{
    position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:5vh 8vw;opacity:0;pointer-events:none;transform:translateX(24px);
    transition:opacity .38s ease, transform .38s ease;
  }
  .slide.activa{opacity:1;pointer-events:auto;transform:translateX(0)}
  .slide.saliendo{transform:translateX(-24px)}

  .eyebrow{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;color:var(--tx2);margin-bottom:10px;display:flex;align-items:center;gap:10px}
  .eyebrow .num{color:var(--tx3);font-variant-numeric:tabular-nums}
  h1.h{font-size:clamp(28px,4.2vw,52px);margin:0 0 14px;line-height:1.1;text-wrap:balance;font-weight:800;letter-spacing:-.5px}
  p.lede{font-size:clamp(14px,1.3vw,18px);color:var(--tx2);max-width:62ch;line-height:1.55;margin:0 0 28px}

  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}

  .card{background:var(--elev);border:1px solid var(--bd);border-radius:16px;padding:22px}
  .card h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:9px}
  .card p{margin:0;color:var(--tx2);font-size:13.5px;line-height:1.55}
  .card ul{margin:10px 0 0;padding-left:18px}
  .card li{font-size:13px;color:var(--tx2);margin-bottom:5px;line-height:1.5}
  .card li b{color:var(--tx)}

  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px;letter-spacing:.3px}

  /* Portada */
  .portada{align-items:flex-start;justify-content:center}
  .portada .marca{display:flex;align-items:center;gap:16px;margin-bottom:44px}
  .portada .marca img{width:56px;height:56px;border-radius:14px}
  .portada .marca span{font-size:14px;letter-spacing:2px;text-transform:uppercase;font-weight:700;color:var(--tx2)}
  .portada h1{font-size:clamp(36px,6vw,68px);max-width:14ch}
  .portada .sub{font-size:clamp(15px,1.6vw,20px);color:var(--tx2);max-width:52ch;line-height:1.6}
  .franja{position:absolute;left:0;right:0;bottom:0;height:6px;display:flex}
  .franja span{flex:1}

  /* Índice */
  .indice{columns:2;column-gap:40px}
  .indice .fila{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);break-inside:avoid;cursor:pointer}
  .indice .fila:hover .titfila{color:var(--azul)}
  .indice .n{color:var(--tx3);font-size:12px;font-variant-numeric:tabular-nums;width:22px}
  .titfila{font-size:14.5px;color:var(--tx)}

  /* Tablas */
  .tabla{width:100%;border-collapse:collapse;font-size:12.5px}
  .tabla th{text-align:left;color:var(--tx2);font-weight:700;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:7px 12px;border-bottom:2px solid var(--bd)}
  .tabla td{padding:7px 12px;border-bottom:1px solid var(--bd);color:var(--tx2)}
  .tabla td.m{color:var(--tx);font-weight:600}
  .tabla code{background:var(--surf);color:var(--azul);padding:2px 6px;border-radius:5px;font-size:11.5px;font-family:'Cascadia Code',Consolas,monospace}
  .tablaWrap{max-height:58vh;overflow-y:auto;border:1px solid var(--bd);border-radius:12px}
  .metodo{font-size:10px;font-weight:800;padding:1px 7px;border-radius:5px;letter-spacing:.3px}
  .m-get{background:#1f6feb22;color:#58a6ff}
  .m-post{background:#23863622;color:#3fb950}
  .m-put{background:#9a690022;color:#d29922}
  .m-delete{background:#da363322;color:#f85149}

  /* Flujo de pasos */
  .flujo{display:flex;flex-direction:column;gap:14px;max-width:64ch}
  .paso{display:flex;gap:16px;align-items:flex-start}
  .paso .bola{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--surf);border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--tx)}
  .paso .txt b{display:block;font-size:14px;margin-bottom:2px}
  .paso .txt p{margin:0;font-size:13px;color:var(--tx2);line-height:1.5}

  /* Diagrama arquitectura */
  .arq{display:flex;align-items:center;justify-content:center;gap:0;margin:20px 0}
  .arq .caja{background:var(--elev);border:1.5px solid var(--bd);border-radius:14px;padding:20px 26px;text-align:center;min-width:150px}
  .arq .caja b{display:block;font-size:14px;margin-bottom:4px}
  .arq .caja span{font-size:11.5px;color:var(--tx2)}
  .arq .flecha{color:var(--tx3);font-size:22px;padding:0 18px}

  .footer-slide{position:absolute;bottom:5vh;left:8vw;right:8vw;display:flex;justify-content:space-between;font-size:11px;color:var(--tx3)}

  /* Controles */
  #controles{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(22,27,34,.85);backdrop-filter:blur(8px);border:1px solid var(--bd);border-radius:999px;padding:8px 16px;z-index:50}
  #controles button{background:transparent;border:none;color:var(--tx);cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px;display:flex;align-items:center}
  #controles button:hover{background:var(--surf)}
  #contador{font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
  #barra{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--azul),var(--morado));z-index:50;transition:width .3s ease}
  #puntos{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:50}
  #puntos .p{width:6px;height:6px;border-radius:50%;background:var(--bd);cursor:pointer;transition:background .2s,transform .2s}
  #puntos .p.on{background:var(--azul);transform:scale(1.6)}
  #hint{position:fixed;top:18px;right:22px;font-size:11px;color:var(--tx3);z-index:50}

  @media(max-width:820px){
    .g2,.g3,.g4{grid-template-columns:1fr}
    .indice{columns:1}
    .slide{padding:4vh 6vw}
    #puntos{display:none}
  }
</style>
</head>
<body>

<div id="barra" style="width:0%"></div>
<div id="hint">← → para navegar · F pantalla completa</div>
<div id="deck"></div>
<div id="puntos"></div>
<div id="controles">
  <button id="btnPrev" title="Anterior">◀</button>
  <span id="contador">1 / 1</span>
  <button id="btnNext" title="Siguiente">▶</button>
  <button id="btnFull" title="Pantalla completa">⛶</button>
</div>

/* ============ DATOS DE APIS (se inyecta en la tabla) ============ */

  ['POST','/api/auth/register','Registro de ciudadano (detecta zona por GPS)'],

  ['GET','/api/dni/:dni','Consulta RENIEC (autocompletar registro)'],
  ['GET','/api/zonas','Listar las 9 zonas'],

/* ============ MOTOR DEL MAZO ============ */
const deck = document.getElementById('deck');
SLIDES.forEach((html, i) => {
  const tmp = document.createElement('div');
  tmp.innerHTML = html.trim();
  const el = tmp.firstElementChild; // ya es <section class="slide ..."> — no envolver de nuevo
  el.id = 'slide-' + i;
  deck.appendChild(el);
});

// Índice automático (a partir de los <h1> de cada slide, excepto portada/cierre)
const indiceHtml = SLIDES.map((_, i) => {
  const m = SLIDES[i].match(/<h1 class="h">(.*?)<\/h1>/s);
  return m ? { i, t: m[1].replace(/<[^>]+>/g,'') } : null;
}).filter(Boolean).slice(1, -1);
document.getElementById('indiceAuto').innerHTML = indiceHtml.map(({i,t}) =>
  `<div class="fila" onclick="ir(${i})"><span class="n">${String(i).padStart(2,'0')}</span><span class="titfila">${t}</span></div>`
).join('');

// Tabla de APIs
document.getElementById('tablaApis').innerHTML = APIS.map(([m,r,d]) => {
  const cls = m.includes('GET') && !m.includes(',') ? 'm-get' : m.includes('POST') && !m.includes(',') ? 'm-post' : m.includes('PUT') && !m.includes(',') ? 'm-put' : m.includes('DELETE') && !m.includes(',') ? 'm-delete' : 'm-get';
  return `<tr><td><span class="metodo ${cls}">${m}</span></td><td><code>${r}</code></td><td>${d}</td></tr>`;
}).join('');

// Puntos de navegación lateral
const puntos = document.getElementById('puntos');
SLIDES.forEach((_, i) => {
  const p = document.createElement('div');
  p.className = 'p'; p.onclick = () => ir(i);
  puntos.appendChild(p);
});

let actual = 0;
function render(){
  document.querySelectorAll('.slide').forEach((s, i) => s.classList.toggle('activa', i === actual));
  document.querySelectorAll('#puntos .p').forEach((p, i) => p.classList.toggle('on', i === actual));
  document.getElementById('contador').textContent = (actual+1) + ' / ' + SLIDES.length;
  document.getElementById('barra').style.width = (((actual+1) / SLIDES.length) * 100) + '%';
}
function ir(i){ actual = Math.max(0, Math.min(SLIDES.length - 1, i)); render(); history.replaceState(null,'','#'+(actual+1)); }
function siguiente(){ ir(actual + 1); }
function anterior(){ ir(actual - 1); }

document.getElementById('btnNext').onclick = siguiente;
document.getElementById('btnPrev').onclick = anterior;
document.getElementById('btnFull').onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
};

document.addEventListener('keydown', (e) => {
  if (['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)) { e.preventDefault(); siguiente(); }
  else if (['ArrowLeft','ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); anterior(); }
  else if (e.key === 'Home') ir(0);
  else if (e.key === 'End') ir(SLIDES.length - 1);
  else if (e.key.toLowerCase() === 'f') document.getElementById('btnFull').click();
});

let touchX = null;
document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (dx < -50) siguiente(); else if (dx > 50) anterior();
  touchX = null;
});

const hash = parseInt(location.hash.replace('#',''), 10);
if (!isNaN(hash)) actual = Math.max(0, Math.min(SLIDES.length - 1, hash - 1));
render();
</script>
